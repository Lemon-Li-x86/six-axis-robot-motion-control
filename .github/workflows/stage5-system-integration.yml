name: Stage 5 integration and APF safeguards

on:
  push:
    branches:
      - feat/stage5-system-integration-2026-10-27
    paths:
      - 'firmware/freertos_demo/**'
      - 'tools/check_protocol_mirror.py'
      - '.github/workflows/stage5-system-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-stage5-and-stage4-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Stage1 UART wire mirror compatibility
        run: python tools/check_protocol_mirror.py
      - name: Compile and exercise Stage5 APF in isolation
        run: |
          cmake -S firmware/freertos_demo/tests/avoidance \
            -B build/stage5-avoidance -G Ninja
          cmake --build build/stage5-avoidance
          ctest --test-dir build/stage5-avoidance --output-on-failure
      - name: Re-run unchanged Stage3/4 native contract suite
        run: |
          cmake -S firmware/freertos_demo/tests/trajectory \
            -B build/stage4-trajectory -G Ninja
          cmake --build build/stage4-trajectory
          ctest --test-dir build/stage4-trajectory --output-on-failure
