name: Stage 5 integration and APF safeguards

on:
  push:
    branches:
      - feat/stage5-system-integration-2026-10-27
      - feat/stage5-apf-path-20261028
    paths:
      - 'firmware/freertos_demo/**'
      - 'tools/check_protocol_mirror.py'
      - 'simulation/pybullet_ur5/src/stage5_static_obstacle_probe.py'
      - 'simulation/pybullet_ur5/src/stage5_collision_validation.py'
      - 'simulation/pybullet_ur5/tests/test_stage5_collision_validation.py'
      - '.github/workflows/stage5-system-integration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'firmware/freertos_demo/**'
      - 'simulation/pybullet_ur5/src/stage5_collision_validation.py'
      - 'simulation/pybullet_ur5/tests/test_stage5_collision_validation.py'
      - '.github/workflows/stage5-system-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-stage5-and-stage4-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Stage1 UART wire mirror compatibility
        run: python tools/check_protocol_mirror.py
      - name: Compile and exercise Stage5 APF in isolation
        run: |
          cmake -S firmware/freertos_demo/tests/avoidance \
            -B build/stage5-avoidance -G Ninja
          cmake --build build/stage5-avoidance
          ctest --test-dir build/stage5-avoidance --output-on-failure
      - name: Verify production UART parser against corrupt, partial and lost-byte streams
        run: |
          cmake -S firmware/freertos_demo/tests/host \
            -B build/stage5-host -G Ninja
          cmake --build build/stage5-host
          ctest --test-dir build/stage5-host --output-on-failure
      - name: Re-run unchanged Stage3/4 native contract suite
        run: |
          cmake -S firmware/freertos_demo/tests/trajectory \
            -B build/stage4-trajectory -G Ninja
          cmake --build build/stage4-trajectory
          ctest --test-dir build/stage4-trajectory --output-on-failure

  pybullet-static-cuboid-c-apf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install physics simulator
        run: python -m pip install pybullet
      - name: Build real C avoidance algorithm as host shared library
        run: |
          cmake -S firmware/freertos_demo/tests/avoidance \
            -B build/stage5-avoidance -G Ninja
          cmake --build build/stage5-avoidance
          ctest --test-dir build/stage5-avoidance --output-on-failure
      - name: Verify C APF step against PyBullet static box geometry
        run: |
          python simulation/pybullet_ur5/src/stage5_static_obstacle_probe.py \
            --library build/stage5-avoidance/libstage5_apf_bridge.so \
            --output-dir build/stage5-pybullet
      - name: Verify every UR5 link against static obstacles using actual PyBullet
        run: python -m unittest discover -s simulation/pybullet_ur5/tests -p 'test_stage5_collision_validation.py' -v
      - name: Preserve geometry and planner diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-static-cuboid-c-apf-probe
          path: build/stage5-pybullet/*
          if-no-files-found: ignore
