name: Stage5 QEMU UART FreeRTOS PyBullet closed loop

on:
  push:
    branches:
      - feat/stage5-system-integration-2026-10-27
    paths:
      - 'firmware/freertos_demo/**'
      - 'simulation/pybullet_ur5/src/stage5_qemu_uart_closed_loop.py'
      - 'simulation/pybullet_ur5/src/qemu_uart_receiver.py'
      - '.github/workflows/stage5-qemu-uart-pybullet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual_uart_full_loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain, UART QEMU, PyBullet and cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            qemu-system-arm ninja-build
          python -m pip install pybullet
      - name: Build QEMU-only firmware with explicit virtual serial output
        run: |
          cmake -S . -B build/stage5-qemu-uart -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake \
            -DROBOT_ENABLE_STAGE4_TASKS=ON \
            -DROBOT_ENABLE_STAGE4_COMMAND_OUTPUT=ON \
            -DROBOT_ENABLE_STAGE5_QEMU_UART_INTEGRATION=ON \
            -DROBOT_ENABLE_STAGE4_QEMU_MOTION_SELF_TEST=OFF
          cmake --build build/stage5-qemu-uart --target freertos_demo
      - name: Real TCP UART move request and PyBullet feedback roundtrip
        run: |
          timeout 75s python simulation/pybullet_ur5/src/stage5_qemu_uart_closed_loop.py \
            --elf build/stage5-qemu-uart/firmware/freertos_demo/freertos_demo.elf \
            --output-dir build/stage5-uart-results
      - name: Preserve serial end-to-end measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-real-qemu-uart-pybullet
          path: build/stage5-uart-results/*
          if-no-files-found: ignore
