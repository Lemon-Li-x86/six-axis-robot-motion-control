name: Stage5 live QEMU PyBullet observer

on:
  push:
    branches:
      - feat/stage5-live-qemu-pybullet-gui-20261027
      - fix/stage5-native-pybullet-interaction-20261027
      - fix/stage5-qmp-physics-clock-gate-20261028
      - fix/stage5-native-gui-feedback-overflow-20261028
      - feat/stage5-gui-preserved-integration-20261030
      - fix/stage5-safe-jog-small-step-hold-20261031
      - fix/stage5-final-closeout-20261031
      - feat/stage5-rtos-apf-closure-20261101
      - fix/stage5-verdict-docs-20261101
    paths:
      - '.github/workflows/stage5-live-gui.yml'
      - 'simulation/pybullet_ur5/src/stage5_qemu_uart_live_gui.py'
      - 'simulation/pybullet_ur5/src/stage5_qemu_uart_visual_demo.py'
      - 'simulation/pybullet_ur5/src/qemu_clock_gate.py'
      - 'tools/tests/test_stage5_live_gui.py'
      - 'tools/tests/test_stage5_visual_demo.py'
      - 'tools/tests/test_stage5_gui_apf_integration.py'
      - 'tools/tests/test_stage5_gui_joint_travel.py'
      - 'tools/tests/test_stage5_gui_avoidance_visibility.py'
      - 'tools/tests/test_stage5_gui_safe_jog.py'
      - 'tools/tests/test_stage5_gui_acceptance.py'
      - 'tools/check_stage5_safe_gui_acceptance.py'
      - 'simulation/pybullet_ur5/src/stage5_safe_gui_jog.py'
      - 'tools/tests/test_stage5_native_joint_stops.py'
      - 'simulation/pybullet_ur5/src/stage5_qemu_uart_closed_loop.py'
      - 'tools/run_stage5_live_windows.ps1'
      - 'tools/run_stage5_controlled_recovery_windows.ps1'
      - 'tools/tests/run_stage5_controlled_apf_hold_recovery.py'
      - 'tools/tests/test_stage5_obstacle_hold_recovery.py'
      - 'simulation/pybullet_ur5/src/stage5_obstacle_hold_recovery.py'
      - 'simulation/pybullet_ur5/src/stage5_avoidance_preflight.py'
      - 'simulation/pybullet_ur5/src/stage5_avoidance_uart_gate.py'
      - 'simulation/pybullet_ur5/scenarios/stage5_static_obstacles.json'
      - 'CMakePresets.json'
      - 'firmware/freertos_demo/**'
      - 'tools/tests/run_stage5_embedded_apf_uart.py'
      - 'tools/tests/test_stage5_embedded_apf_runtime.py'
      - 'tools/tests/test_stage5_auto_bypass_selection.py'
      - 'tools/run_stage5_embedded_apf_windows.ps1'
      - 'docs/part5/18_stage5_windows_final_two_step_acceptance.md'
      - 'README.md'
      - 'tools/tests/test_readme_links.py'
      - 'tools/stage5_existing_python.py'
      - 'tools/tests/test_stage5_existing_python.py'
      - 'tools/tests/run_stage5_first_leg_native_bullet.py'
      - 'tools/run_stage5_first_leg_native_bullet_windows.ps1'
      - 'tools/run_stage5_embedded_apf_windows.ps1'
      - 'simulation/pybullet_ur5/src/qemu_uart_receiver.py'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ipc-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test nonblocking live-frame delivery and measurement validation
        run: |
          python -m unittest discover -s tools/tests -p 'test_stage5_live_gui.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_visual_demo.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_gui_apf_integration.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_gui_joint_travel.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_gui_avoidance_visibility.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_gui_safe_jog.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_gui_acceptance.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_embedded_apf_runtime.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_auto_bypass_selection.py' -v
          python -m unittest discover -s tools/tests -p 'test_readme_links.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_existing_python.py' -v

  genuine-qemu-uart-live-observer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ARM QEMU and PyBullet
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            qemu-system-arm ninja-build gdb-multiarch
          python -m pip install numpy pybullet
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        if: runner.os == 'Windows'
      - name: Install Windows QEMU and PyBullet
        if: runner.os == 'Windows'
        run: |
          choco install qemu --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "QEMU install failed" }
          "C:\Program Files\qemu" | Out-File -FilePath $env:GITHUB_PATH -Append
          python -m pip install numpy pybullet
      - name: Real Bullet URDF joint-stop physics against imposed torque
        run: |
          python -m unittest discover -s tools/tests -p 'test_stage5_native_joint_stops.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_gui_joint_travel.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_gui_avoidance_visibility.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_gui_safe_jog.py' -v
          python -m unittest discover -s tools/tests -p 'test_stage5_gui_acceptance.py' -v
      - name: Build real Cortex-M4 FreeRTOS UART firmware
        run: |
          cmake --preset stage5-live-uart
          cmake --build --preset stage5-live-uart
      - name: Observe measured joint movement DURING QEMU UART feedback
        run: |
          python simulation/pybullet_ur5/src/stage5_qemu_uart_live_gui.py --headless-observer --elf build/stage5-live-uart/firmware/freertos_demo/freertos_demo.elf --scenario six_axis --output-dir build/stage5-live-evidence
      - name: Slow PyBullet consumer without GUI must not accumulate virtual UART frames
        run: |
          python simulation/pybullet_ur5/src/stage5_qemu_uart_visual_demo.py --headless --headless-step-delay-ms 18 --no-hold --timeout-s 120 --elf build/stage5-live-uart/firmware/freertos_demo/freertos_demo.elf --scenario six_axis --output-dir build/stage5-live-evidence/slow-consumer
      - name: Native PyBullet external-torque disturbance and hold recovery
        run: |
          python simulation/pybullet_ur5/src/stage5_qemu_uart_live_gui.py --headless-observer --elf build/stage5-live-uart/firmware/freertos_demo/freertos_demo.elf --test-disturbance-recovery --disturbance-cycles 3 --hold-seconds 65 --timeout-s 60 --no-hold --output-dir build/stage5-live-evidence/disturbance-recovery
      - name: FreeRTOS scheduling and stale-feedback regression
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build/stage5-task-regression -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake -DROBOT_ENABLE_STAGE4_TASKS=ON -DROBOT_ENABLE_STAGE4_COMMAND_OUTPUT=OFF -DROBOT_ENABLE_STAGE5_QEMU_UART_INTEGRATION=OFF -DROBOT_ENABLE_STAGE4_QEMU_MOTION_SELF_TEST=ON
          cmake --build build/stage5-task-regression --target freertos_demo
          bash tools/ci_stage4_rtos_qemu.sh build/stage5-task-regression/firmware/freertos_demo/freertos_demo.elf build/stage5-live-evidence/rtos-regression.log
      - name: Preserve physical trace and protocol diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-live-qemu-measured-state-evidence-${{ runner.os }}
          path: build/stage5-live-evidence/*
          if-no-files-found: ignore

  native-gui-no-drag-xvfb:
    # Real p.GUI stepping (not DIRECT), software-rendered under Xvfb.
    # Separate from the known-unreliable external-torque disturbance check.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ARM QEMU, Bullet and virtual X server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            qemu-system-arm ninja-build xvfb xauth libgl1-mesa-dri libglx-mesa0
          python -m pip install numpy pybullet
      - name: Compile virtual-only firmware for UART loop
        run: |
          cmake --preset stage5-live-uart
          cmake --build --preset stage5-live-uart
      - name: Run full three-segment native GUI without mouse input
        run: |
          timeout 120s xvfb-run -a -s "-screen 0 1280x800x24" \
            python simulation/pybullet_ur5/src/stage5_qemu_uart_live_gui.py \
            --elf build/stage5-live-uart/firmware/freertos_demo/freertos_demo.elf \
            --scenario six_axis --opengl2 --no-hold --timeout-s 60 \
            --output-dir build/stage5-ci-gui-nodrag
      - name: Assert real three-segment physical verdict (not merely process exit)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("build/stage5-ci-gui-nodrag/result.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report.get("passed") is True, report
          assert report.get("segments_requested") == 3, report
          assert report.get("segments_settled") == 3, report
          assert report.get("clock_alignment_passed") is True, report
          assert report.get("max_final_segment_error_deg") is not None, report
          assert report.get("bad_checksum_frames") == 0, report
          assert report.get("bad_ack_frames") == 0, report
          faults = report.get("fault_counters")
          assert isinstance(faults, dict) and faults, report
          assert all(value == 0 for value in faults.values()), faults
          print("[STAGE5 LEGACY GUI] PASS: 3/3 physically settled with healthy UART/clock")
          PY
      - name: Preserve GUI physical motion and latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-gui-nodrag-xvfb
          path: build/stage5-ci-gui-nodrag/*
          if-no-files-found: ignore

  native-gui-scripted-j6-xvfb:
    # Independent from the legacy no-drag smoke: must truly execute C APF/IK,
    # UART, full-link collision checks and a settled recovery in native p.GUI.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ARM QEMU, Bullet and virtual X server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            qemu-system-arm ninja-build xvfb xauth libgl1-mesa-dri libglx-mesa0
          python -m pip install numpy pybullet
      - name: Compile virtual-only firmware for UART loop
        run: |
          cmake --preset stage5-live-uart
          cmake --build --preset stage5-live-uart
      - name: Build production C APF host library for native GUI integration
        run: |
          cmake -S firmware/freertos_demo/tests/avoidance -B build/stage5-avoidance-gui -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/stage5-avoidance-gui --parallel 2
          ctest --test-dir build/stage5-avoidance-gui --output-on-failure
      - name: Real Bullet/C APF regression for GUI +2deg after settled residual
        run: |
          STAGE5_APF_TEST_DLL="$PWD/build/stage5-avoidance-gui/libstage5_apf_bridge.so" \
            python -m unittest discover -s tools/tests -p 'test_stage5_obstacle_hold_recovery.py' -v
      - name: Native GUI + real QEMU UART + guarded J6 +0.5deg recovery (scripted CI input)
        run: |
          timeout 210s xvfb-run -a -s "-screen 0 1280x800x24" \
            python simulation/pybullet_ur5/src/stage5_qemu_uart_live_gui.py \
            --elf build/stage5-live-uart/firmware/freertos_demo/freertos_demo.elf \
            --scenario six_axis --opengl2 --timeout-s 100 --hold-seconds 90 \
            --stage5-c-apf-library build/stage5-avoidance-gui/libstage5_apf_bridge.so \
            --stage5-route-case blocked --safe-gui-jog --ci-scripted-safe-jog \
            --output-dir build/stage5-ci-gui-scripted-j6
      - name: Independently audit native GUI scripted J6 physical C/UART verdict
        run: |
          python tools/check_stage5_safe_gui_acceptance.py build/stage5-ci-gui-scripted-j6/result.json
      - name: Preserve native GUI scripted C APF/UART acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-gui-scripted-j6-xvfb
          path: build/stage5-ci-gui-scripted-j6/*
          if-no-files-found: ignore
      - name: Show guarded GUI worker logs on failure
        if: failure()
        run: |
          if [ -f build/stage5-ci-gui-scripted-j6/worker.log ]; then
            tail -n 100 build/stage5-ci-gui-scripted-j6/worker.log
          fi
          if [ -f build/stage5-ci-gui-scripted-j6/result.json ]; then
            cat build/stage5-ci-gui-scripted-j6/result.json
          fi

  native-gui-j6-two-step-xvfb:
    # Regression from Windows operator evidence: a first recovered 0.5deg
    # request must NOT make the next legitimate 2.0deg J6 click fail.
    # Native Bullet GUI + real C APF/IK library + QEMU ARM FreeRTOS/UART.
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ARM QEMU, Bullet and virtual X server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            qemu-system-arm ninja-build xvfb xauth libgl1-mesa-dri libglx-mesa0
          python -m pip install numpy pybullet
      - name: Compile virtual-only firmware for UART loop
        run: |
          cmake --preset stage5-live-uart
          cmake --build --preset stage5-live-uart
      - name: Build production C APF/IK and check real-physics 2deg return
        run: |
          cmake -S firmware/freertos_demo/tests/avoidance -B build/stage5-avoidance-gui -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/stage5-avoidance-gui --parallel 2
          ctest --test-dir build/stage5-avoidance-gui --output-on-failure
          STAGE5_APF_TEST_DLL="$PWD/build/stage5-avoidance-gui/libstage5_apf_bridge.so" \
            python -m unittest discover -s tools/tests -p 'test_stage5_obstacle_hold_recovery.py' -v
      - name: Native GUI real UART J6 half degree then two degrees, both C returned
        run: |
          timeout 320s xvfb-run -a -s "-screen 0 1280x800x24" \
            python simulation/pybullet_ur5/src/stage5_qemu_uart_live_gui.py \
            --elf build/stage5-live-uart/firmware/freertos_demo/freertos_demo.elf \
            --scenario six_axis --opengl2 --timeout-s 110 --hold-seconds 180 \
            --stage5-c-apf-library build/stage5-avoidance-gui/libstage5_apf_bridge.so \
            --stage5-route-case blocked --safe-gui-jog --ci-scripted-safe-jog-two-step \
            --output-dir build/stage5-ci-gui-two-step
      - name: Independently verify both click results and both physical returns
        run: |
          python tools/check_stage5_safe_gui_acceptance.py \
            build/stage5-ci-gui-two-step/result.json --two-step
      - name: Preserve separate J6 0.5+2deg real UART and physics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-gui-two-step-xvfb
          path: build/stage5-ci-gui-two-step/*
          if-no-files-found: ignore
      - name: Print decisive logs if two-step regression fails
        if: failure()
        run: |
          test ! -f build/stage5-ci-gui-two-step/worker.log || tail -n 100 build/stage5-ci-gui-two-step/worker.log
          test ! -f build/stage5-ci-gui-two-step/result.json || cat build/stage5-ci-gui-two-step/result.json

  native-gui-j6-five-repeat-xvfb:
    # Reproduce the operator's 5 GUI clicks: 0.5,2,2,2,2deg.
    # Former code rejected clicks 4 and 5 after three real returns.
    # Test all five real QEMU/FreeRTOS UART returns, not only UI counters.
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ARM QEMU, Bullet and virtual X server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            qemu-system-arm ninja-build xvfb xauth libgl1-mesa-dri libglx-mesa0
          python -m pip install numpy pybullet
      - name: Build ARM FreeRTOS and real C APF joint-route library
        run: |
          cmake --preset stage5-live-uart
          cmake --build --preset stage5-live-uart
          cmake -S firmware/freertos_demo/tests/avoidance -B build/stage5-repeat-apf -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/stage5-repeat-apf --parallel 2
          ctest --test-dir build/stage5-repeat-apf --output-on-failure
      - name: Real native GUI, five verified J6 clicks and firmware recoveries
        run: |
          timeout 460s xvfb-run -a -s "-screen 0 1280x800x24" \
            python simulation/pybullet_ur5/src/stage5_qemu_uart_live_gui.py \
            --elf build/stage5-live-uart/firmware/freertos_demo/freertos_demo.elf \
            --scenario six_axis --opengl2 --timeout-s 150 --hold-seconds 310 \
            --stage5-c-apf-library build/stage5-repeat-apf/libstage5_apf_bridge.so \
            --stage5-route-case blocked --safe-gui-jog --ci-scripted-safe-jog-repeat \
            --output-dir build/stage5-ci-gui-five-repeat
      - name: Fail unless all five movements physically return with no refusals
        run: |
          python tools/check_stage5_safe_gui_acceptance.py \
            build/stage5-ci-gui-five-repeat/result.json --repeat
      - name: Retain five-click UART/PyBullet evidence including failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-gui-five-repeat-xvfb
          path: build/stage5-ci-gui-five-repeat/*
          if-no-files-found: ignore
      - name: Print failure reasons and last C/UART trace
        if: failure()
        run: |
          test ! -f build/stage5-ci-gui-five-repeat/worker.log || tail -n 100 build/stage5-ci-gui-five-repeat/worker.log
          test ! -f build/stage5-ci-gui-five-repeat/result.json || cat build/stage5-ci-gui-five-repeat/result.json

  embedded-apf-c-rtos-uart-bullet:
    # Original PDF Stage5 5.2: the C APF+FK+IK computation must happen
    # ON ARM FreeRTOS Trajectory stack, then a real UART proposal is
    # physically full-link gated before a separate C joint request.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ARM QEMU, GNU compiler and Bullet
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm ninja-build
          python -m pip install numpy pybullet
      - name: Regression - embedded ARM APF runtime must inspect every UR5 link
        run: |
          python -m unittest discover -s tools/tests -p 'test_stage5_embedded_apf_runtime.py' -v
      - name: Build real FreeRTOS ARM UART firmware with embedded APF/IK
        run: |
          cmake --preset stage5-live-uart
          cmake --build --preset stage5-live-uart
      - name: Real ARM APF/IK proposal, full-link Bullet approval, C UART PID movement
        run: |
          python tools/tests/run_stage5_embedded_apf_uart.py \
            --elf build/stage5-live-uart/firmware/freertos_demo/freertos_demo.elf \
            --timeout-s 105 \
            --output-dir build/stage5-embedded-apf-uart
      - name: Verify repeated ARM APF replan from fresh physical feedback
        run: |
          python tools/tests/run_stage5_embedded_apf_uart.py \
            --elf build/stage5-live-uart/firmware/freertos_demo/freertos_demo.elf \
            --timeout-s 155 --proposals 3 \
            --output-dir build/stage5-embedded-apf-uart-three
      - name: Finish blocked static rectangle mission via ARM firmware C APF
        run: |
          python tools/tests/run_stage5_embedded_apf_uart.py \
            --elf build/stage5-live-uart/firmware/freertos_demo/freertos_demo.elf \
            --timeout-s 300 --full-route \
            --output-dir build/stage5-embedded-apf-uart-full
      - name: Independently require full-link runtime queries in real ARM route
        run: |
          python -c "import json; from pathlib import Path; p=Path('build/stage5-embedded-apf-uart-full/result.json'); r=json.loads(p.read_text()); assert r['passed'] is True and r['route_complete'] is True and r['runtime_full_link_queries'] >= 7*r['joint_motion_acks'] > 0, r"
      - name: First APF leg independent native C+Bullet without QEMU
        run: |
          cmake -S firmware/freertos_demo/tests/simulation -B build/stage5-first-leg-ci -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/stage5-first-leg-ci --target stage4_sim_bridge --parallel 2
          python tools/tests/run_stage5_first_leg_native_bullet.py \
            --library build/stage5-first-leg-ci/libstage4_sim_bridge.so \
            --output-dir build/stage5-first-leg-ci-evidence --frames 800
      - name: Preserve actual firmware APF UART decision and physical trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-embedded-arm-apf-verified-physical
          path: |
            build/stage5-embedded-apf-uart/*
            build/stage5-embedded-apf-uart-three/*
            build/stage5-embedded-apf-uart-full/*
          if-no-files-found: ignore

  windows-embedded-apf-first-leg-diagnostic:
    # Windows integration regression: deliberately report real FAIL if the
    # reference/PID/limiter trace does not physically settle, preserving logs.
    # Ephemeral GitHub runner packages are unrelated to the user's local venv.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
      - name: Install QEMU and pre-existing user-compatible Bullet ABI on CI
        shell: pwsh
        run: |
          choco install qemu --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "QEMU install failed" }
          "C:\Program Files\qemu" | Out-File -FilePath $env:GITHUB_PATH -Append
          python -m pip install numpy==2.4.6 pybullet==3.2.7
          if ($LASTEXITCODE -ne 0) { throw "CI PyBullet wheel install failed" }
      - name: Build QEMU FreeRTOS firmware
        shell: pwsh
        run: |
          cmake --preset stage5-live-uart
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
          cmake --build --preset stage5-live-uart
          if ($LASTEXITCODE -ne 0) { throw "Firmware build failed" }
      - name: Capture Windows first-leg C control trace with actual QEMU
        shell: pwsh
        run: |
          python tools/tests/run_stage5_embedded_apf_uart.py --elf build/stage5-live-uart/firmware/freertos_demo/freertos_demo.elf --timeout-s 70 --proposals 1 --output-dir build/stage5-windows-arm-control-trace
          if ($LASTEXITCODE -ne 0) { throw "Embedded APF physical verdict FAIL (trace retained)" }
      - name: Preserve Windows ARM trace even when first-leg verdict fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-windows-arm-control-trace
          path: build/stage5-windows-arm-control-trace/*
          if-no-files-found: ignore

  native-firmware-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run existing C algorithm regressions
        run: |
          cmake -S firmware/freertos_demo/tests/host -B build/stage5-native-regression -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/stage5-native-regression --parallel 2
          ctest --test-dir build/stage5-native-regression --output-on-failure
      - name: Reproduce user first APF leg with production native C PID and limiter
        run: |
          cmake -S firmware/freertos_demo/tests/simulation -B build/stage5-native-control-bridge -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/stage5-native-control-bridge --parallel 2
          ctest --test-dir build/stage5-native-control-bridge --output-on-failure -V

  windows-c-apf-bridge:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile production C APF/IK host bridge as a Windows DLL
        shell: pwsh
        run: |
          # Prefer the runner's installed MSVC toolset, not VS 2022 specifically.
          # Mirrors the tested tools/run_stage5_controlled_recovery_windows.ps1.
          cmake -S firmware/freertos_demo/tests/avoidance -B build/stage5-avoidance-win
          if ($LASTEXITCODE -ne 0) { throw "C APF configure failed" }
          cmake --build build/stage5-avoidance-win --config Debug
          if ($LASTEXITCODE -ne 0) { throw "C APF build failed" }
          ctest --test-dir build/stage5-avoidance-win -C Debug --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "C APF host tests failed" }
          $dll = Get-ChildItem build/stage5-avoidance-win -Recurse -Filter stage5_apf_bridge.dll | Select-Object -First 1
          if (-not $dll) { throw "Missing Stage5 APF/IK Windows DLL" }
          $env:STAGE5_APF_TEST_DLL = $dll.FullName
          python -c "import ctypes,os; d=ctypes.CDLL(os.environ['STAGE5_APF_TEST_DLL']); [getattr(d,n) for n in ['robot_apf_segment_blocked','stage5_apf_points_to_joint_route','stage5_apf_joint_pose_limits']]; print('C APF/IK Windows DLL exports PASS')"
          if ($LASTEXITCODE -ne 0) { throw "C APF ctypes exports unavailable" }

  windows-controlled-obstacle-recovery:
    # Same entrypoint provided to the user; actual PC Windows QEMU + C DLL.
    # No GUI mouse picking, no physical motor hardware and no interaction claim.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
      - name: Install QEMU and PyBullet on Windows
        shell: pwsh
        run: |
          choco install qemu --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "QEMU install failed" }
          "C:\Program Files\qemu" | Out-File -FilePath $env:GITHUB_PATH -Append
          python -m pip install numpy pybullet
          if ($LASTEXITCODE -ne 0) { throw "PyBullet installation failed" }
      - name: Smoke-test read-only Stage5 Python resolution
        shell: pwsh
        run: |
          . .\tools\resolve_stage5_python.ps1
          # Regression for the user's registered uv/Astral interpreter format.
          $astral = 'C:\Users\Example\AppData\Roaming\uv\python\cpython-3.11.15-windows-x86_64-none\python.exe'
          $astralLine = '-V:Astral/CPython3.11.15 ' + $astral
          if ((Get-Stage5PythonPathFromLauncherLine -Line $astralLine) -ne $astral) {
            throw "Astral/uv launcher path was not recognized"
          }
          $active = 'D:\repo\.venv\Scripts\python.exe'
          if ((Get-Stage5PythonPathFromLauncherLine -Line ('*               ' + $active)) -ne $active) {
            throw "Active virtualenv launcher path was not recognized"
          }
          $python = Resolve-Stage5Python -RepoRoot (Get-Location).Path
          & $python -c "import sys, numpy, pybullet; print('resolver interpreter OK:', sys.executable)"
          if ($LASTEXITCODE -ne 0) { throw "Selected Python cannot import simulation dependencies" }
          try {
            Resolve-Stage5Python -RequestedPython 'C:\no-stage5-python-here\python.exe' -RepoRoot (Get-Location).Path | Out-Null
            throw "Invalid explicit Python path was not rejected"
          } catch {
            if ($_.Exception.Message -notmatch 'No existing Python interpreter') { throw }
          }
      - name: Verify one-command production DLL plus C APF UART controlled recovery
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\run_stage5_controlled_recovery_windows.ps1 -Python python -Qemu qemu-system-arm -OutputDir build/stage5-recovery-windows-ci
          if ($LASTEXITCODE -ne 0) { throw "Windows controlled recovery failed" }
          $a = Get-Content build/stage5-recovery-windows-ci/controlled_recovery_acceptance.json -Raw | ConvertFrom-Json
          if ($a.passed -ne $true) { throw "Windows controlled recovery evidence not PASS" }
      - name: Validate GUI +2deg after 0.02deg HOLD residual on actual Windows Bullet/C DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build/stage5-avoidance-win -Recurse -File |
            Where-Object { $_.Name -eq "stage5_apf_bridge.dll" -or
                           $_.Name -eq "libstage5_apf_bridge.dll" } |
            Select-Object -First 1
          if ($null -eq $dll) { throw "C APF DLL missing for GUI 2deg safety regression" }
          $env:STAGE5_APF_TEST_DLL = $dll.FullName
          python -m unittest discover -s tools/tests -p 'test_stage5_obstacle_hold_recovery.py' -v
          if ($LASTEXITCODE -ne 0) { throw "GUI +2deg recovery regression failed" }
      - name: Archive Windows controlled C APF/QEMU recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-windows-controlled-obstacle-recovery
          path: build/stage5-recovery-windows-ci/*
          if-no-files-found: ignore
