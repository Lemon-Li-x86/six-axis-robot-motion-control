name: Stage 3-4 integration host regression

on:
  push:
    branches:
      - feat/stage4-trajectory-2026-10-26
    paths:
      - 'firmware/freertos_demo/**'
      - '.github/workflows/stage4-trajectory-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage3-stage4-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure all isolated native motion tests
        run: cmake -S firmware/freertos_demo/tests/trajectory -B build/stage4-trajectory -G Ninja
      - name: Compile with strict warnings
        run: cmake --build build/stage4-trajectory
      - name: Run Stage3 + Stage4 CTest regression
        run: ctest --test-dir build/stage4-trajectory --output-on-failure
